app: "my-container-fn"
region: "asia-south1"

serverlessConfig:
  serverlessId: "new-id"
  Name: "my-container-fn"
  Description: ""
  Runtime: "container"
  # Environment variables for your serverless function
  # To add env variables, replace {} with key-value pairs like:
  # Env:
  #   API_KEY: "your-api-key"
  Env: {}
  PortMap: []
  Scaling:
    AutoStop: false
    Min: 1
    Max: 1
    MaxIdleTime: 300
  Resources:
    CPU: 0.1
    MemoryMB: 128
    MemoryMaxMB: 128
  Timeout: 60
  Validations: null
  ContainerOpts:
    Image: "nginx:latest"
    Args: []
    Command: ""

build:
  builtin: dockerfile
  ignorefile: .gitignore
