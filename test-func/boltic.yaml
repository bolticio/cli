app: "test-func"
region: "asia-south1"
handler: "handler.handler"
language: "nodejs/20"

serverlessConfig:
  Name: "test-func"
  Description: ""
  Runtime: "code"
  # Environment variables for your serverless function
  # To add env variables, replace {} with key-value pairs like:
  # Env:
  #   API_KEY: "your-api-key"
  Env: {}
  PortMap: []
  Scaling:
    AutoStop: false
    Min: 1
    Max: 1
    MaxIdleTime: 300
  Resources:
    CPU: 0.1
    MemoryMB: 128
    MemoryMaxMB: 128
  Timeout: 60
  Validations: null

build:
  builtin: dockerfile
  ignorefile: .gitignore
